<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ サムネ作成</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@900&family=Reggae+One&family=RocknRoll+One&display=swap" rel="stylesheet">
<style>
/* 上に写真の貼り付け欄、下に案ごとのサムネ(1280x720)と設定 */
:root {
  --bg: #f4f3ef; --panel: #ffffff; --text: #24221e; --muted: #6d685f; --line: #e1ddd4;
  --accent: #2f5d8a; --done: #2e7d4f; --done-bg: #eef7f1;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1a1917; --panel: #23211e; --text: #ece8e0; --muted: #a39d92; --line: #3a3631;
    --accent: #4f86bd; --done: #6cc28f; --done-bg: #1f2e25; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
  font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif; font-size: 14px; }
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
header h1 { font-size: 18px; margin: 0; }
header nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
button, select, input[type=text] { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 4px 10px; }
button { cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: bold; }
input[type=text] { width: 100%; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { max-width: 1400px; margin: 0 auto; padding: 8px 20px 80px; }
.notice { color: var(--muted); font-size: 13px; margin: 12px 0; }
.notice b { color: var(--text); }
h2 { font-size: 16px; margin: 22px 0 8px; padding-left: 10px; border-left: 4px solid var(--accent); }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.photo { background: var(--panel); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.photo.selected { border-color: var(--accent); }
.photo.done { background: var(--done-bg); }
.photo .head { display: flex; gap: 8px; align-items: baseline; }
.photo .no { font-weight: bold; font-variant-numeric: tabular-nums; }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.buttons a { font-size: 12px; text-decoration: none; color: #fff; background: var(--accent); border-radius: 5px; padding: 2px 8px; }
.buttons a.alt { background: #6b7f96; }
.paste { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 44px; border: 2px dashed var(--line);
  border-radius: 8px; padding: 6px 10px; color: var(--muted); text-align: left; }
.paste img { max-height: 80px; max-width: 140px; border-radius: 4px; display: block; }
.paste .clear { margin-left: auto; white-space: nowrap; }
.plan { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px;
  display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; }
.plan h3 { margin: 0 0 8px; font-size: 15px; grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; }
.plan h3 .spacer { flex: 1; }
.stage canvas.big { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 6px; cursor: grab; touch-action: none; background: #000; }
.stage canvas.big:active { cursor: grabbing; }
.stage .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
.small { display: flex; gap: 10px; align-items: flex-end; margin-top: 10px; }
.small canvas { width: 168px; height: 94.5px; border-radius: 4px; display: block; }
.small span { color: var(--muted); font-size: 12px; }
.ctrl { display: grid; grid-template-columns: 104px minmax(0, 1fr); gap: 6px 8px; align-content: start; font-size: 13px; }
.ctrl label { color: var(--muted); padding-top: 4px; }
.ctrl .row2 { display: flex; gap: 6px; }
.ctrl input[type=range] { width: 100%; }
.ctrl .note { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #24221e; color: #fff;
  padding: 8px 16px; border-radius: 8px; z-index: 20; font-size: 14px; }
@media (max-width: 900px) { .plan { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>__TITLE__ サムネ作成</h1>
  <nav>
    <label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="sideWin"> 検索を右半分の窓で開く</label>
    <button type="button" class="primary" id="saveAll">全部の案を保存</button>
  </nav>
</header>
<main>
  <p class="notice">
    <b>1.</b> 写真の番号ごとのボタンで画像検索 → 画像を右クリック →「画像をコピー」→ ここに戻って <b>Ctrl+V</b>(選んでいる番号に入ります)。<br>
    <b>2.</b> 下のサムネの写真は <b>ドラッグで移動、マウスホイールで拡大・縮小</b>。文字や表情は右の欄で変えられます。<br>
    <b>3.</b>「保存」で 1280×720 のJPG(YouTubeの上限2MB以内)を保存。3案をYouTube Studioの<b>「テストと比較」</b>に入れると、クリック率の高い方を自動で選んでくれます。
  </p>
  <h2>写真</h2>
  <div class="photos" id="photos"></div>
  <h2>サムネ案</h2>
  <div id="plans"></div>
</main>
<div id="toast" hidden></div>
<script>
const DATA = /*__DATA__*/null;
const W = 1280, H = 720;
const PAGE_KEY = "thumb:" + DATA.id;
const FONTS = { "Noto Sans JP": "縦長の太ゴシック(いつもの型)", "Dela Gothic One": "極太", "RocknRoll One": "丸ゴシック", "Reggae One": "筆っぽい" };
const FALLBACK = '"Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif';

function el(tag, attrs = {}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of children) if (c != null) e.append(c);
  return e;
}
let toastTimer = null;
function toast(text) {
  const t = document.getElementById("toast");
  t.textContent = text; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2500);
}
function loadJson(key, fallback) { try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; } }
function saveJson(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }

// ---- 表情の画像(白いふち付き) ----
const faces = {};
function loadImage(src) { return new Promise((ok, ng) => { const i = new Image(); i.onload = () => ok(i); i.onerror = ng; i.src = src; }); }
function sticker(img) {
  // ステッカーのような白いふちと影をつけた画像を作っておく
  const pad = 14, c = document.createElement("canvas");
  c.width = img.width + pad * 2; c.height = img.height + pad * 2;
  const g = c.getContext("2d");
  const sil = document.createElement("canvas"); sil.width = img.width; sil.height = img.height;
  const s = sil.getContext("2d"); s.drawImage(img, 0, 0); s.globalCompositeOperation = "source-in"; s.fillStyle = "#fff"; s.fillRect(0, 0, sil.width, sil.height);
  g.shadowColor = "rgba(0,0,0,.55)"; g.shadowBlur = 14; g.shadowOffsetY = 4;
  for (let a = 0; a < 24; a++) { const t = a / 24 * Math.PI * 2; g.drawImage(sil, pad + Math.cos(t) * 8, pad + Math.sin(t) * 8); }
  g.shadowColor = "transparent";
  g.drawImage(img, pad, pad);
  return c;
}
async function loadFaces() {
  await Promise.all(Object.entries(DATA.faces).map(async ([k, src]) => { faces[k] = sticker(await loadImage(src)); }));
}

// ---- 貼った写真(このブラウザに保存) ----
const photos = new Map();   // 番号 → { blob, img }
let selected = 1;
let db = null;
function openDb() {
  return new Promise(resolve => {
    try {
      const req = indexedDB.open("thumbnail-photos", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("images");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => resolve(null);
    } catch (e) { resolve(null); }
  });
}
function dbPut(no, blob) {
  if (!db) return;
  try { const st = db.transaction("images", "readwrite").objectStore("images"); blob ? st.put(blob, PAGE_KEY + ":" + no) : st.delete(PAGE_KEY + ":" + no); } catch (e) {}
}
function dbGet(no) {
  return new Promise(resolve => {
    if (!db) return resolve(null);
    try { const r = db.transaction("images").objectStore("images").get(PAGE_KEY + ":" + no); r.onsuccess = () => resolve(r.result || null); r.onerror = () => resolve(null); }
    catch (e) { resolve(null); }
  });
}
async function setPhoto(no, blob, quiet = false) {
  if (blob) {
    const url = URL.createObjectURL(blob);
    try { photos.set(no, { blob, img: await loadImage(url) }); }
    catch (e) { toast("この画像は読み込めませんでした。別の画像をコピーしてください。"); return; }
  } else photos.delete(no);
  if (!quiet) {
    dbPut(no, blob);
    // 新しい写真にしたら、その写真の位置と拡大を元に戻す
    for (const p of plans) { p.state.views = p.state.views.map((v, i) => p.state.photos[i] === no ? autoView(no, p.state.layout, i) : v); p.save(); }
  }
  renderPhoto(no);
  plans.forEach(p => p.draw());
  if (blob && !quiet) {
    toast(no + "番に貼りました");
    const next = DATA.photos.findIndex((_, i) => !photos.has(i + 1));
    if (next >= 0) selectPhoto(next + 1);
  }
}
function selectPhoto(no) {
  document.getElementById("photo" + selected)?.classList.remove("selected");
  selected = no;
  document.getElementById("photo" + no)?.classList.add("selected");
}
const google = q => "https://www.google.com/search?q=" + encodeURIComponent(q) + "&tbm=isch";
const yahoo = q => "https://search.yahoo.co.jp/image/search?p=" + encodeURIComponent(q);
const bing = q => "https://www.bing.com/images/search?q=" + encodeURIComponent(q);
function buildPhotos() {
  const box = document.getElementById("photos");
  DATA.photos.forEach((p, i) => {
    const no = i + 1;
    const card = el("div", { class: "photo", id: "photo" + no, onclick: () => selectPhoto(no) },
      el("div", { class: "head" }, el("span", { class: "no" }, "写真 " + no), el("span", {}, p.ja)),
      el("div", { class: "buttons" },
        el("a", { href: google(p.ja + " 写真"), target: "_blank", rel: "noopener" }, "Google(日本語)"),
        p.en !== p.ja ? el("a", { href: google(p.en), target: "_blank", rel: "noopener" }, "Google(英語)") : null,
        el("a", { class: "alt", href: yahoo(p.ja), target: "_blank", rel: "noopener" }, "Yahoo!"),
        el("a", { class: "alt", href: bing(p.ja), target: "_blank", rel: "noopener" }, "Bing")),
      el("button", { type: "button", class: "paste", id: "paste" + no }));
    card.addEventListener("dragover", e => e.preventDefault());
    card.addEventListener("drop", e => { e.preventDefault(); selectPhoto(no); dropImage(no, e.dataTransfer); });
    box.append(card);
    renderPhoto(no);
  });
  selectPhoto(1);
}
function renderPhoto(no) {
  const zone = document.getElementById("paste" + no);
  if (!zone) return;
  zone.replaceChildren();
  const p = photos.get(no);
  document.getElementById("photo" + no).classList.toggle("done", !!p);
  if (!p) { zone.append("ここを選んで Ctrl+V で写真を貼る"); return; }
  const clear = el("button", { type: "button", class: "clear", onclick: e => { e.stopPropagation(); setPhoto(no, null); } }, "外す");
  zone.append(el("img", { src: p.img.src, alt: "写真" + no }), "貼り付け済み(Ctrl+Vで差し替え)", clear);
}
document.addEventListener("paste", e => {
  if (e.target.closest && e.target.closest("input, textarea")) return;
  const file = [...(e.clipboardData?.items || [])].filter(i => i.type.startsWith("image/")).map(i => i.getAsFile())[0];
  if (!file) { toast("画像がコピーされていません。画像を右クリック →「画像をコピー」してください。"); return; }
  setPhoto(selected, file);
});
function dataUrlToBlob(url) {
  const [head, body] = url.split(",");
  const type = (head.match(/data:([^;]+)/) || [])[1] || "image/png";
  const bin = head.includes(";base64") ? atob(body) : decodeURIComponent(body);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type });
}
async function dropImage(no, dt) {
  const file = [...(dt?.files || [])].find(f => f.type.startsWith("image/"));
  if (file) { setPhoto(no, file); return; }
  const html = dt?.getData("text/html") || "";
  const src = (html.match(/<img[^>]+src="([^"]+)"/i) || [])[1];
  const url = (src || dt?.getData("text/uri-list") || dt?.getData("text/plain") || "").split("\n")[0].trim().replace(/&amp;/g, "&");
  if (url.startsWith("data:image/")) { setPhoto(no, dataUrlToBlob(url)); return; }
  if (/^https?:/.test(url)) {
    try { const res = await fetch(url, { mode: "cors" }); const blob = await res.blob(); if (res.ok && blob.type.startsWith("image/")) { setPhoto(no, blob); return; } } catch (e) {}
  }
  toast("この画像はドラッグでは入れられませんでした。右クリック →「画像をコピー」→ Ctrl+V で貼ってください。");
}
// 検索を画面の右半分の窓で開く
const sideWin = document.getElementById("sideWin");
try { sideWin.checked = localStorage.getItem("image-list-side-window") !== "off"; } catch (e) { sideWin.checked = true; }
sideWin.addEventListener("change", () => { try { localStorage.setItem("image-list-side-window", sideWin.checked ? "on" : "off"); } catch (e) {} });
let searchWin = null;
document.addEventListener("click", e => {
  const a = e.target.closest(".buttons a");
  if (!a || !sideWin.checked || e.ctrlKey || e.shiftKey || e.metaKey || e.button !== 0) return;
  const sw = screen.availWidth, sh = screen.availHeight, left = (screen.availLeft || 0) + Math.floor(sw / 2), top = screen.availTop || 0;
  try { if (searchWin && !searchWin.closed) { searchWin.location.href = a.href; searchWin.focus(); e.preventDefault(); return; } } catch (err) {}
  const w = window.open(a.href, "image-search", `popup,width=${Math.floor(sw / 2)},height=${sh},left=${left},top=${top}`);
  if (w) { searchWin = w; try { w.focus(); } catch (err) {} e.preventDefault(); }
});

// ---- 描く ----
function font(size, family) { return `${family === "Noto Sans JP" ? "900 " : ""}${size}px "${family}", ${FALLBACK}`; }
// 「69歳まで|{A級}にいた男」→ 行ごとの [{t, em}]
function parseText(text) {
  return text.split("|").map(line => {
    const parts = [];
    line.replace(/\{([^}]*)\}|([^{]+)/g, (_, em, plain) => { parts.push(em != null ? { t: em, em: true } : { t: plain, em: false }); return ""; });
    return parts.filter(p => p.t);
  }).filter(l => l.length);
}
const EM_SCALE = 1.18;  // 強調の文字は少し大きく
function lineWidth(g, parts, size, family) {
  let w = 0;
  for (const p of parts) { g.font = font(size * (p.em ? EM_SCALE : 1), family); w += g.measureText(p.t).width; }
  return w;
}
// 文字の色の組み合わせ。white: 白文字(強調は指定の色) / red: 赤文字に白ふち / yellow: 黄文字
const STYLES = {
  white: { fill: "#fff", ring: null },
  red: { fill: "#ff1a1a", ring: "#fff" },
  yellow: { fill: "#ffe100", ring: null },
};
// 文字の行を、枠に収まる大きさで描く。bottom(下の位置)、top(上の位置)、middle(まん中の位置)のどれかで置く
function drawTextBlock(g, text, { cx, bottom, top, middle, maxW, maxH, color, family, scale = 1, maxSize = 150, style = "white", stretch = 1 }) {
  const lines = parseText(text);
  if (!lines.length) return;
  const st = STYLES[style] || STYLES.white;
  const gap = 0.06;
  const size = Math.min(maxSize, maxH / stretch / (lines.length * (1 + gap) * EM_SCALE)) * scale;
  const sizes = lines.map(parts => Math.min(size, size * maxW / Math.max(1, lineWidth(g, parts, size, family))));
  const heights = lines.map((parts, i) => sizes[i] * stretch * (1 + gap) * (parts.some(p => p.em) ? EM_SCALE : 1));
  const total = heights.reduce((a, b) => a + b, 0);
  let y = top != null ? top + total : middle != null ? middle + total / 2 : bottom;
  for (let i = lines.length - 1; i >= 0; i--) {
    const parts = lines[i], s = sizes[i];
    const w = lineWidth(g, parts, s, family);
    let x = cx - w / 2;
    for (const p of parts) {
      const ps = s * (p.em ? EM_SCALE : 1);
      g.font = font(ps, family);
      g.textBaseline = "alphabetic"; g.textAlign = "left"; g.lineJoin = "round"; g.miterLimit = 2;
      const ring = st.ring || (p.em && style === "white" ? "#fff" : null);
      const ringW = st.ring ? (stretch > 1 ? 0.26 : 0.2) : 0.1;
      // 縦に伸ばすときは、文字の下の位置を原点にして縦だけ拡大する
      g.save(); g.translate(x, y - s * 0.12 * stretch); g.scale(1, stretch);
      // 影 → 太い黒ふち → (白ふち) → 文字
      g.save(); g.shadowColor = "rgba(0,0,0,.6)"; g.shadowBlur = ps * 0.18;
      g.strokeStyle = "rgba(0,0,0,.55)"; g.lineWidth = ps * (ring ? 0.2 + ringW : 0.3); g.strokeText(p.t, ps * 0.03, ps * 0.04);
      g.restore();
      g.strokeStyle = "#000"; g.lineWidth = ps * (ring ? 0.1 + ringW : 0.24); g.strokeText(p.t, 0, 0);
      if (ring) { g.strokeStyle = ring; g.lineWidth = ps * ringW; g.strokeText(p.t, 0, 0); }
      if (!p.em && style === "red") {
        // 赤は上を明るく下を濃く(いつもの型)
        const gr = g.createLinearGradient(0, -ps * 0.85, 0, 0); gr.addColorStop(0, "#ff3a3a"); gr.addColorStop(1, "#cc0000");
        g.fillStyle = gr;
      } else g.fillStyle = p.em ? color : st.fill;
      g.fillText(p.t, 0, 0);
      x += g.measureText(p.t).width;
      g.restore();
    }
    y -= heights[i];
  }
}
function drawBand(g, text, x, y, family, centered = false) {
  if (!text) return;
  const size = 44;
  g.font = font(size, family);
  const w = g.measureText(text).width + 56, h = size + 26;
  if (centered) x = (W - w) / 2;
  g.save();
  g.shadowColor = "rgba(0,0,0,.5)"; g.shadowBlur = 10; g.shadowOffsetY = 4;
  g.fillStyle = "#e3141e";
  g.beginPath(); g.moveTo(x + 14, y); g.lineTo(x + w, y); g.lineTo(x + w - 14, y + h); g.lineTo(x, y + h); g.closePath(); g.fill();
  g.restore();
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.textAlign = "left";
  g.fillText(text, x + 28, y + h / 2 + 2);
}
function drawLabel(g, text, x, y, bg, family) {
  if (!text) return;
  const size = 50;
  g.font = font(size, family);
  const w = g.measureText(text).width + 40, h = size + 22;
  g.fillStyle = bg; g.fillRect(x - w / 2, y, w, h);
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.fillText(text, x - w / 2 + 20, y + h / 2 + 2);
}
function drawName(g, name, x, y, family, align = "right") {
  const size = 52;
  g.font = font(size, family); g.textBaseline = "top"; g.lineJoin = "round";
  const w = g.measureText(name).width;
  const left = align === "right" ? x - w : x;
  g.strokeStyle = "#000"; g.lineWidth = 12; g.strokeText(name, left, y);
  g.fillStyle = "#fff"; g.fillText(name, left, y);
}
// 写真を枠いっぱいに(はみ出しは切る)。view は {x, y, z}: ドラッグとホイールで変わる
function drawPhoto(g, no, rect, view, mono = false) {
  const p = photos.get(no);
  g.save();
  g.beginPath(); g.rect(rect.x, rect.y, rect.w, rect.h); g.clip();
  if (!p) {
    g.fillStyle = "#3a3f4a"; g.fillRect(rect.x, rect.y, rect.w, rect.h);
    g.fillStyle = "#c9ced8"; g.font = font(40, "Dela Gothic One"); g.textBaseline = "middle";
    const t = `写真 ${no} を貼ってください`; g.fillText(t, rect.x + (rect.w - g.measureText(t).width) / 2, rect.y + rect.h / 2);
  } else {
    const img = p.img;
    const s = Math.max(rect.w / img.width, rect.h / img.height) * view.z;
    const w = img.width * s, h = img.height * s;
    g.filter = mono ? "grayscale(1) contrast(1.3) brightness(1.04)" : "contrast(1.12) saturate(1.15)";
    g.drawImage(img, rect.x + (rect.w - w) / 2 + view.x, rect.y + (rect.h - h) / 2 + view.y, w, h);
    g.filter = "none";
  }
  g.restore();
}
function drawFace(g, key, cx, bottom, height, flip = false) {
  const img = faces[key];
  if (!img) return;
  const s = height / img.height, w = img.width * s;
  g.save();
  if (flip) { g.translate(cx, 0); g.scale(-1, 1); g.translate(-cx, 0); }
  g.drawImage(img, cx - w / 2, bottom - height, w, height);
  g.restore();
}
// セリフの吹き出し。(tx, ty) はしっぽの先(ゆっくりの頭の上)
function drawBubble(g, text, cx, cy, tx, ty, family) {
  if (!text) return;
  const lines = text.split("|");
  let size = 52;
  g.font = font(size, family);
  const widest = Math.max(...lines.map(l => g.measureText(l).width));
  if (widest > 430) { size = size * 430 / widest; g.font = font(size, family); }
  const w = Math.max(...lines.map(l => g.measureText(l).width)) + 44, h = lines.length * size * 1.2 + 30;
  const x = Math.min(W - 10 - w, Math.max(10, cx - w / 2)), y = cy - h / 2;
  g.save();

  g.shadowColor = "rgba(0,0,0,.45)"; g.shadowBlur = 10; g.shadowOffsetY = 4;
  const bx = Math.min(x + w - 40, Math.max(x + 40, tx));
  g.beginPath();
  g.roundRect(x, y, w, h, 18);
  g.moveTo(bx - 18, y + h); g.lineTo(tx, ty); g.lineTo(bx + 18, y + h);
  g.stroke(); g.shadowColor = "transparent"; g.fill();
  g.fillRect(bx - 15, y + h - 6, 30, 8);  // しっぽの付け根の線を消す
  g.fillStyle = "#111"; g.textBaseline = "middle"; g.textAlign = "center";
  lines.forEach((l, i) => g.fillText(l, x + w / 2, y + 15 + size * 0.6 + i * size * 1.2));
  g.restore();
}
// 顔の位置が分かっている写真(--photo で入れたもの)は、型に合わせて顔が良い大きさ・位置になるようにする
const FACE_TARGET = {
  "顔アップ": { h: 320, x: 0.5, y: 370 }, "吹き出し": { h: 250, x: 0.5, y: 360 }, "右に写真": { h: 280, x: 0.5, y: 360 },
  "全面写真": { h: 260, x: 0.5, y: 320 }, "比較": { h: 220, x: 0.5, y: 330 },
};
function autoView(no, layout, index) {
  const f = (DATA.face_boxes || {})[no], p = photos.get(no), t = FACE_TARGET[layout];
  const r = photoRects(layout)[index];
  if (!f || !p || !t || !r) return { x: 0, y: 0, z: 1 };
  const k = p.img.width / f.iw;  // 埋め込むときに縮めた分
  const cx = f.cx * k, cy = f.cy * k, fh = f.h * k;
  const s0 = Math.max(r.w / p.img.width, r.h / p.img.height);
  const z = Math.min(6, Math.max(1, t.h / fh / s0)), s = s0 * z;
  const w = p.img.width * s, h = p.img.height * s;
  // 顔を目標の位置へ。ただし写真の端が枠の中に入らないようにする
  let x = r.x + r.w * t.x - (r.x + (r.w - w) / 2 + cx * s);
  let y = (r.y + t.y) - (r.y + (r.h - h) / 2 + cy * s);

  x = Math.max(-mx, Math.min(mx, x)); y = Math.max(-my, Math.min(my, y));

}

}

function drawSpeech(g, st) {
  const fam = st.font, fs = st.faceScale;
  if (st.layout === "吹き出し") {
    if (st.reimu !== "なし") drawBubble(g, st.reimuSays, 250, 200, 140 * fs, 560 - 225 * fs, fam);
    if (st.marisa !== "なし") drawBubble(g, st.marisaSays, W - 260, 200, W - 150 * fs, 560 - 235 * fs, fam);

    const small = st.layout === "顔アップ" || st.layout === "文字だけ";
    const hr = (small ? 82 : 220) * fs, hm = (small ? 86 : 230) * fs;
    if (st.reimu !== "なし") drawBubble(g, st.reimuSays, 230, H - hr - 70, 90 * fs, H - hr + 10, fam);

    el("div", { class: "note" }, "| で改行、{ } で囲むと強調の色。顔アップの型は上の一言(1行12文字くらいまで)"),

function exportPlan(plan, title) {
  const missing = plan.state.photos.slice(0, plan.state.layout === "比較" ? 2 : 1).filter(n => !photos.has(n));
  if (missing.length && !confirm(`写真 ${missing.join("・")} がまだ貼られていません。このまま保存しますか？`)) return Promise.resolve();
  return new Promise(resolve => {
    const tryQuality = q => plan.canvas.toBlob(blob => {
      if (blob.size > 1.95 * 1024 * 1024 && q > 0.5) return tryQuality(q - 0.08);  // YouTubeは2MBまで
      const a = el("a", { href: URL.createObjectURL(blob), download: `${DATA.name}_サムネ_${title}.jpg` });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(title + " を保存しました");
      resolve();
    }, "image/jpeg", q);
    tryQuality(0.92);
  });
}

      for (const p of plans) {
        // 自分で動かした写真はそのまま
        p.state.views = p.state.views.map((v, j) => p.state.photos[j] === no && v.x === 0 && v.y === 0 && v.z === 1 ? autoView(no, p.state.layout, j) : v);
        p.draw();
      }
    }
  }
  const first = DATA.photos.findIndex((_, i) => !photos.has(i + 1));
  selectPhoto(first >= 0 ? first + 1 : 1);
})();
</script>
</body>
