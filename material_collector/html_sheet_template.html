<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ 素材シート</title>
<style>
/* 左に台本、右に台本順の画像番号ごとの候補画像と検索ボタン。話題ごとに見出しで区切る */
:root {
  --bg: #f4f3ef; --panel: #ffffff; --text: #24221e; --muted: #6d685f; --line: #e1ddd4;
  --accent: #2f5d8a; --accent-2: #5b6f86; --marisa: #a87a00; --reimu: #b8382b; --ok: #2e7d4f; --warn: #b4610b;
  --pick: #2e7d4f; --pick-bg: #eef7f1; --shade: rgba(20, 18, 15, 0.82);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1a1917; --panel: #23211e; --text: #ece8e0; --muted: #a39d92; --line: #3a3631;
    --accent: #4f86bd; --accent-2: #6b7f96; --marisa: #e0b43a; --reimu: #ef7b6c; --ok: #6cc28f; --warn: #f0a556;
    --pick: #6cc28f; --pick-bg: #1f2e25; --shade: rgba(0, 0, 0, 0.85);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--text); line-height: 1.6;
  font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif; font-size: 14px; }
header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
header h1 { font-size: 18px; margin: 0; }
header .stats { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
header nav { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--panel); color: var(--text);
  border-radius: 6px; padding: 3px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.notice { max-width: 1560px; margin: 12px auto 0; padding: 0 20px; color: var(--muted); font-size: 13px; }
.notice b { color: var(--text); }
main { max-width: 1560px; margin: 0 auto; padding: 8px 20px 100px; }
.topic { font-size: 16px; margin: 26px 0 8px; padding-left: 10px; border-left: 4px solid var(--accent); text-wrap: balance; }
.seg { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 2fr); gap: 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
.lineno { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-bottom: 4px; }
.script p { margin: 0 0 3px; }
.sp { font-weight: bold; }
.sp.marisa { color: var(--marisa); }
.sp.reimu { color: var(--reimu); }
.slots { display: grid; gap: 10px; align-content: start; }
.slot { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 8px; }
.slot.picked { border-color: var(--pick); background: var(--pick-bg); }
.slot-head { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; align-items: center; }
.no { width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center;
  font-weight: bold; font-size: 13px; font-variant-numeric: tabular-nums; grid-row: span 2; }
.slot.picked .no { background: var(--pick); }
.words .ja { font-weight: bold; font-size: 15px; word-break: break-word; }
.words .en { color: var(--muted); font-size: 12px; word-break: break-word; }
.buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.buttons a { display: inline-block; text-decoration: none; color: #fff; background: var(--accent); border-radius: 6px;
  padding: 3px 11px; font-size: 12px; font-weight: bold; }
.buttons a.en { background: var(--accent-2); }
.buttons a:hover { filter: brightness(1.12); }
.status { font-size: 12px; color: var(--muted); }
.status.warn { color: var(--warn); }
.images { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.card { margin: 0; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; }
.card.picked { border-color: var(--pick); }
.card img { display: block; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #000; cursor: zoom-in; }
.card figcaption { padding: 4px 6px; font-size: 11px; line-height: 1.4; word-break: break-word; flex: 1; color: var(--muted); }
.card figcaption a { color: var(--accent); }
.card .use { margin: 0 6px 6px; }
.card.picked .use { background: var(--pick); color: #fff; border-color: var(--pick); }
.more { grid-column: 1 / -1; justify-self: start; }
.placeholder { grid-column: 1 / -1; color: var(--muted); font-size: 12px; padding: 12px; border: 2px dashed var(--line); border-radius: 8px; text-align: center; }
.placeholder.warn { color: var(--warn); border-color: var(--warn); }
#lightbox { position: fixed; inset: 0; background: var(--shade); display: grid; place-items: center; z-index: 30; padding: 24px; }
#lightbox img { max-width: 92vw; max-height: 86vh; object-fit: contain; }
#lightbox p { color: #fff; text-align: center; font-size: 13px; margin: 8px 0 0; }
@media (max-width: 960px) {
  .seg { grid-template-columns: 1fr; }
  .images { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
</style>
</head>
<body>
<header>
  <h1>__TITLE__ 素材シート</h1>
  <span class="stats" id="stats"></span>
  <nav><button type="button" id="next">次の未決定へ</button></nav>
</header>
<p class="notice"><b>使い方:</b> 番号は台本の順番です。スクロールすると、番号ごとに検索ワードで画像を自動で探して並べます。
使いたい画像を<b>右クリック →「画像をコピー」→ YMM4に貼り付け</b>。決めた画像は「これにする」を押すと緑になります。
自動で出ない画像は、青いボタン(日本語)・灰色のボタン(英語)でGoogle画像検索が開きます。<br>
<b>ChromeかEdgeで開いてください。</b>Claudeのアプリの中のプレビューでは自動検索は動きません。</p>
<main id="main"></main>
<div id="lightbox" hidden><div><img alt=""><p></p></div></div>
<script>
const DATA = /*__DATA__*/null;
const PAGE_SIZE = 3;
const STORAGE_KEY = "material-sheet:" + DATA.title;

function stripHtml(s) {
  const d = document.createElement("div");
  d.innerHTML = s || "";
  return (d.textContent || "").trim();
}
const google = q => "https://www.google.com/search?q=" + encodeURIComponent(q) + "&tbm=isch";

// ---------------------------------------------------------------- 自動検索の取得元(ライセンスでは絞り込まない)
async function getJson(url) {
  const res = await fetch(url, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}
const SOURCES = {
  async wikimedia(q, limit) {
    const p = new URLSearchParams({
      origin: "*", action: "query", format: "json", generator: "search",
      gsrsearch: q + " filetype:bitmap", gsrnamespace: "6", gsrlimit: String(limit * 2),
      prop: "imageinfo", iiprop: "url|extmetadata|mime", iiurlwidth: "1280", iiextmetadatalanguage: "ja",
      iiextmetadatafilter: "LicenseShortName|Artist|ObjectName",
    });
    const json = await getJson("https://commons.wikimedia.org/w/api.php?" + p);
    const pages = Object.values((json.query && json.query.pages) || {}).sort((a, b) => (a.index || 0) - (b.index || 0));
    const out = [];
    for (const page of pages) {
      const info = (page.imageinfo || [])[0] || {};
      if (!/^image\/(jpeg|png|webp|tiff)$/.test(info.mime || "")) continue;
      const meta = info.extmetadata || {};
      out.push({
        source: "Wikimedia", image: info.thumburl || info.url, page: info.descriptionurl,
        title: stripHtml((meta.ObjectName || {}).value) || (page.title || "").replace(/^File:/, ""),
        license: stripHtml((meta.LicenseShortName || {}).value),
      });
      if (out.length >= limit) break;
    }
    return out;
  },
  async openverse(q, limit) {
    const json = await getJson("https://api.openverse.org/v1/images/?" + new URLSearchParams({ q, page_size: String(limit) }));
    return (json.results || []).filter(i => i.url).slice(0, limit).map(i => ({
      source: "Openverse", image: i.url, page: i.foreign_landing_url || i.url, title: i.title || "",
      license: ("CC " + (i.license || "").toUpperCase() + " " + (i.license_version || "")).trim(),
    }));
  },
};

// 見つからないときに試す、少しずつ短くした検索ワード(年代や細かい語を外していく)
function relaxed(q) {
  const words = q.split(/\s+/).filter(Boolean);
  const out = [];
  const noYear = words.filter(w => !/^\d{3,4}(年代?|s)?$/.test(w) && !/年代$/.test(w));
  if (noYear.length && noYear.length < words.length) out.push(noYear.join(" "));
  if (noYear.length > 2) out.push(noYear.slice(0, 2).join(" "));
  if (noYear.length > 1) out.push(noYear[0]);
  return [...new Set(out)].filter(x => x && x !== q);
}

let active = 0;
const waiting = [];
function limited(fn) {
  return new Promise((resolve, reject) => {
    const run = () => { active++; fn().then(resolve, reject).finally(() => { active--; if (waiting.length) waiting.shift()(); }); };
    active < 4 ? run() : waiting.push(run);
  });
}

// ---------------------------------------------------------------- 決めた画像(このブラウザに保存)
let picks = {};
try { picks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch (e) { picks = {}; }
function savePicks() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(picks)); } catch (e) { /* 保存できなくても表示は続ける */ }
  const total = slots.length;
  document.getElementById("stats").textContent = `${DATA.segments.length}か所 ・ 画像${total}枚 ・ 決定 ${Object.keys(picks).length}/${total}`;
}

// ---------------------------------------------------------------- 描画
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k);
  return e;
};
const speakerClass = s => s.includes("魔理沙") ? "marisa" : s.includes("霊夢") ? "reimu" : "";

const slots = [];
function renderSlot(img) {
  const slot = { img, results: [], shown: PAGE_SIZE, loaded: false, failures: new Set() };
  slots.push(slot);
  slot.status = el("span", { class: "status" }, "スクロールすると探します");
  slot.images = el("div", { class: "images" }, el("div", { class: "placeholder" }, "待機中…"));
  slot.box = el("div", { class: "slot" + (picks[img.no] ? " picked" : ""), id: "img" + img.no, "data-slot": String(slots.length - 1) },
    el("div", { class: "slot-head" },
      el("div", { class: "no" }, String(img.no)),
      el("div", { class: "words" }, el("div", { class: "ja" }, img.ja), img.en !== img.ja ? el("div", { class: "en" }, img.en) : null)),
    el("div", { class: "buttons" },
      el("a", { href: google(img.ja), target: "_blank", rel: "noopener" }, "Google画像検索(日本語)"),
      img.en !== img.ja ? el("a", { class: "en", href: google(img.en), target: "_blank", rel: "noopener" }, "Google画像検索(英語)") : null,
      img.native ? el("a", { class: "en", href: google(img.native), target: "_blank", rel: "noopener" }, "Google画像検索(母語)") : null,
      slot.status),
    slot.images);
  return slot.box;
}

function renderImages(slot) {
  const box = slot.images;
  box.replaceChildren();
  if (!slot.loaded) { box.append(el("div", { class: "placeholder" }, "画像を探しています…")); return; }
  if (!slot.results.length) {
    const offline = slot.failures.has("wikimedia") && slot.failures.has("openverse");
    box.append(el("div", { class: "placeholder warn" }, offline
      ? "画像サイトに接続できませんでした。ChromeかEdgeで開いているか確認してください。上のGoogleボタンからは探せます。"
      : "自動では見つかりませんでした。上のGoogleボタンで探してください。"));
  }
  slot.results.slice(0, slot.shown).forEach(r => {
    const chosen = picks[slot.img.no] === r.image;
    const imgEl = el("img", { src: r.image, alt: r.title || "", loading: "lazy", referrerpolicy: "no-referrer", title: "クリックで拡大 / 右クリック→画像をコピー" });
    imgEl.addEventListener("click", () => openLightbox(r));
    imgEl.addEventListener("error", () => { imgEl.closest(".card").hidden = true; });
    box.append(el("figure", { class: "card" + (chosen ? " picked" : "") }, imgEl,
      el("figcaption", {}, (r.title || "").slice(0, 50), el("br"), r.source, r.license ? " ・ " + r.license : "", " ・ ",
        el("a", { href: r.page, target: "_blank", rel: "noopener" }, "出典")),
      el("button", { type: "button", class: "use", onclick: () => pick(slot, r) }, chosen ? "これにする ✓" : "これにする")));
  });
  if (slot.results.length > slot.shown) {
    box.append(el("button", { type: "button", class: "more", onclick: () => { slot.shown += PAGE_SIZE; renderImages(slot); } },
      `ほかの候補を見る(残り${slot.results.length - slot.shown}枚)`));
  }
}

function pick(slot, r) {
  if (picks[slot.img.no] === r.image) delete picks[slot.img.no]; else picks[slot.img.no] = r.image;
  slot.box.classList.toggle("picked", !!picks[slot.img.no]);
  savePicks();
  renderImages(slot);
}

async function search(slot) {
  const img = slot.img;
  slot.status.textContent = "探しています…";
  renderImages(slot);
  const seen = new Set();
  const add = list => { for (const r of list) if (r.image && !seen.has(r.image)) { seen.add(r.image); slot.results.push(r); } };
  const attempt = async (name, q, limit) => {
    try { return await limited(() => SOURCES[name](q, limit)); } catch (e) { slot.failures.add(name); return []; }
  };
  // まずそのままの検索ワード、足りなければ年代などを外して探し直す
  const jaQueries = [img.ja, ...relaxed(img.ja)];
  const enQueries = img.en !== img.ja ? [img.en, ...relaxed(img.en)] : [];
  for (let i = 0; i < Math.max(jaQueries.length, enQueries.length); i++) {
    const tasks = [];
    if (jaQueries[i]) tasks.push(attempt("wikimedia", jaQueries[i], 6));
    if (enQueries[i]) tasks.push(attempt("wikimedia", enQueries[i], 6), attempt("openverse", enQueries[i], 6));
    (await Promise.all(tasks)).forEach(add);
    slot.loaded = true;
    renderImages(slot);
    if (slot.results.length >= PAGE_SIZE * 2) break;
  }
  slot.loaded = true;
  const failed = [...slot.failures];
  slot.status.className = "status" + (failed.length ? " warn" : "");
  slot.status.textContent = failed.length ? "接続できなかった取得元: " + failed.join("、") : `自動の候補 ${slot.results.length}枚`;
  renderImages(slot);
}

// ---------------------------------------------------------------- 拡大表示
const lightbox = document.getElementById("lightbox");
function openLightbox(r) {
  lightbox.querySelector("img").src = r.image;
  lightbox.querySelector("p").textContent = (r.title || "") + "(クリックで閉じる)";
  lightbox.hidden = false;
}
lightbox.addEventListener("click", () => { lightbox.hidden = true; });
document.addEventListener("keydown", e => { if (e.key === "Escape") lightbox.hidden = true; });

// ---------------------------------------------------------------- 組み立て
const main = document.getElementById("main");
let lastTopic = null;
for (const seg of DATA.segments) {
  if (seg.topic !== lastTopic) { main.append(el("h2", { class: "topic" }, seg.topic)); lastTopic = seg.topic; }
  const script = el("div", { class: "script" }, el("div", { class: "lineno" }, `${seg.start}〜${seg.end}行目`));
  for (const l of seg.lines) {
    script.append(el("p", {}, l.speaker ? el("span", { class: "sp " + speakerClass(l.speaker) }, l.speaker) : null,
      l.speaker ? "「" + l.text + "」" : l.text));
  }
  main.append(el("section", { class: "seg" }, script, el("div", { class: "slots" }, ...seg.images.map(renderSlot))));
}
savePicks();

document.getElementById("next").addEventListener("click", () => {
  const next = slots.find(s => !picks[s.img.no]);
  if (next) next.box.scrollIntoView({ block: "center", behavior: "smooth" });
});

// 画面に近づいた番号から順に探す
const observer = new IntersectionObserver(entries => {
  for (const entry of entries) {
    if (!entry.isIntersecting) continue;
    observer.unobserve(entry.target);
    search(slots[Number(entry.target.dataset.slot)]);
  }
}, { rootMargin: "600px 0px" });
slots.forEach(s => observer.observe(s.box));
</script>
</body>
</html>
